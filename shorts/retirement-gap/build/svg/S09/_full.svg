<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect x="0" y="0" width="1080" height="1920" fill="#000000" fill-opacity="0"/><g id="ai"></g><g id="bg"><defs><linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5d6a" stop-opacity="0.85"/><stop offset="1" stop-color="#2f5d6a" stop-opacity="0"/></linearGradient><linearGradient id="bot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5d6a" stop-opacity="0"/><stop offset="1" stop-color="#2f5d6a" stop-opacity="0.55"/></linearGradient></defs><rect x="0" y="0" width="1080" height="720" fill="url(#top)"/><rect x="0" y="1300" width="1080" height="620" fill="url(#bot)"/><rect x="319.2" y="165.8" width="441.6" height="68.4" rx="34.2" fill="#ffd166"/><text x="540" y="213.68" font-family="Jua" font-size="38" fill="#3a2a4a" text-anchor="middle" >지식 쇼츠 · 노후 준비</text></g><g id="title"><text x="540" y="430" font-family="Jua" font-size="92" fill="#ffffff" text-anchor="middle" stroke="#3a2a4a" stroke-width="12" paint-order="stroke" stroke-linejoin="round">다리 ④ 일하는 소득</text></g><g id="work"><rect x="116" y="632" width="860" height="300" rx="34" fill="#000000" fill-opacity="0.18"/><rect x="110" y="620" width="860" height="300" rx="34" fill="#f5f3ee" fill-opacity="0.96"/><text x="540" y="720" font-family="Do Hyeon" font-size="46" fill="#1d1d1f" text-anchor="middle" >재취업 · 계속 고용 · 작은 일거리</text><text x="540" y="850" font-family="Black Han Sans" font-size="80" fill="#1f7a6d" text-anchor="middle" >월 100만 원이라도</text></g><g id="why"><rect x="116" y="982" width="860" height="260" rx="34" fill="#000000" fill-opacity="0.18"/><rect x="110" y="970" width="860" height="260" rx="34" fill="#f5f3ee" fill-opacity="0.96"/><text x="540" y="1060" font-family="Do Hyeon" font-size="46" fill="#1d1d1f" text-anchor="middle" >버는 만큼 모아 둔 돈을</text><text x="540" y="1180" font-family="Black Han Sans" font-size="84" fill="#e4572e" text-anchor="middle" >덜 꺼내 써요</text></g></svg>