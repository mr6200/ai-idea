# 형사 추리극 1화: 예약된 알리바이
# - 모든 컷은 "한 화면에 한 사람"만 나오는 구도입니다 (shot / reverse-shot).
# - 인물마다 기준이미지(refs/<인물>.png) 1장을 만들고, 그 인물의 모든 컷은
#   반드시 같은 기준이미지에서 출발하므로 얼굴·의상·배경이 바뀌지 않습니다.

title: "예약된 알리바이"
subtitle: "형사 강도윤 사건 파일 #1"

video:
  width: 1920          # 최종 유튜브 출력 해상도
  height: 1080
  fps: 25
  ref_width: 1280      # 기준이미지 해상도 (16:9, 16의 배수)
  ref_height: 720
  pad_before: 0.25     # 대사 앞 여백(초)
  pad_after: 0.45      # 대사 뒤 여백(초) - 컷 사이 호흡
  title_seconds: 4.0
  ending_seconds: 4.0

# 세 인물이 공유하는 공간 묘사. 모든 기준이미지 프롬프트에 붙어서 같은 취조실처럼 보이게 합니다.
setting: >-
  inside a dim police interrogation room at night, bare grey concrete wall,
  a single overhead lamp, dark one-way mirror in the background,
  cool blue ambient light mixed with warm tungsten key light,
  cinematic 35mm film still, shallow depth of field, subtle film grain,
  photorealistic, head-and-shoulders framing, face clearly visible, mouth closed

characters:
  detective:
    name: "강도윤"
    role: "강력반 형사 (40대)"
    seed: 1101
    prompt: >-
      a Korean male detective in his late 40s, short black hair greying at the temples,
      light stubble, tired but sharp eyes, dark charcoal coat over a white shirt with a loosened
      dark tie, sitting at a metal table, body turned slightly to the right, looking toward the camera
    talk_prompt: >-
      A middle-aged Korean detective in a dark coat speaks calmly and firmly in a dim
      interrogation room, subtle head movement, static camera
    voice: "ko-KR-InJoonNeural"
    rate: "-6%"
    pitch: "-6Hz"

  suspect:
    name: "한서진"
    role: "갤러리 공동대표, 용의자 (30대)"
    seed: 2201
    prompt: >-
      a Korean woman in her early 30s, shoulder-length straight black hair, elegant beige silk
      blouse, small pearl earrings, sitting at a metal table, body turned slightly to the left,
      looking toward the camera, composed but tense
    talk_prompt: >-
      An elegant Korean woman in a beige blouse speaks in a dim interrogation room,
      subtle natural head movement, static camera
    voice: "ko-KR-SunHiNeural"
    rate: "+0%"
    pitch: "+0Hz"

  rookie:
    name: "오민규"
    role: "신참 형사 (20대)"
    seed: 3301
    prompt: >-
      a young Korean male police detective in his mid 20s, neat short black hair, navy suit,
      police ID lanyard, standing near the grey metal door of the interrogation room,
      holding a manila document folder, looking toward the camera, earnest expression
    talk_prompt: >-
      A young Korean detective in a navy suit holding a folder speaks urgently,
      subtle head movement, static camera
    voice: "ko-KR-HyunsuMultilingualNeural"
    rate: "+4%"
    pitch: "+0Hz"

# (선택) FLUX Kontext로 만드는 표정 변형. 02_make_variants.py 를 돌렸을 때만 사용됩니다.
# 변형 이미지가 없으면 자동으로 기준이미지를 그대로 씁니다.
expressions:
  nervous:  "Make the person look nervous and uneasy, eyes slightly averted. Keep the same person, same clothes, same pose, same background, same lighting and same framing."
  angry:    "Make the person look angry and defensive, brows furrowed. Keep the same person, same clothes, same pose, same background, same lighting and same framing."
  shocked:  "Make the person look shocked, eyes slightly widened, lips parted. Keep the same person, same clothes, same pose, same background, same lighting and same framing."
  defeated: "Make the person look defeated and sad, gaze lowered. Keep the same person, same clothes, same pose, same background, same lighting and same framing."
  smirk:    "Give the person a faint confident smirk. Keep the same person, same clothes, same pose, same background, same lighting and same framing."

# 컷 목록: 한 컷 = 한 인물 = 한 대사
# expr: 표정 변형 이름 (없으면 neutral = 기준이미지)
# action: 립싱크 모델에 줄 동작/감정 힌트 (영어)
shots:
  - id: s01
    char: detective
    line: "서은우 대표가 갤러리에서 숨진 채 발견된 건 어젯밤 열한 시 사십 분입니다. 한서진 씨, 그 시간에 어디 계셨죠?"
    action: "he asks the question slowly, eyes fixed on the suspect"

  - id: s02
    char: suspect
    expr: nervous
    line: "집에 있었어요. 몇 번을 말씀드려야 하죠? 은우가 그 조각상에 맞아서 얼마나 아팠을지, 생각만 해도 끔찍해요."
    action: "she answers with a trembling voice, briefly looking down"

  - id: s03
    char: detective
    line: "두 분, 공동 대표셨죠. 그런데 최근에 갤러리 지분 문제로 크게 다투셨다고 들었습니다."
    action: "he speaks evenly, slightly narrowing his eyes"

  - id: s04
    char: suspect
    expr: angry
    line: "사업하다 보면 의견 차이는 있죠. 그게 사람을 죽일 이유가 되나요?"
    action: "she raises her voice defensively"

  - id: s05
    char: detective
    line: "지난주에 서은우 씨가 내용증명을 보냈더군요. 한서진 씨에게 공동 대표에서 물러나 달라는 내용이었습니다."
    action: "he slides a document across the table while speaking"

  - id: s06
    char: suspect
    expr: angry
    line: "그건 은우가 잠깐 흥분해서 그런 거예요. 우린 다시 얘기해 보기로 했어요."
    action: "she answers sharply, avoiding eye contact"

  - id: s07
    char: detective
    line: "아직 아무도 죽였다고 하진 않았습니다. 집에 계셨다는 걸 증명할 수 있습니까?"
    action: "he stays calm, a slight pause before speaking"

  - id: s08
    char: suspect
    expr: smirk
    line: "열 시쯤 배가 고파서 짬뽕을 시켰어요. 열 시 반에 도착했고요. 배달 기록 보시면 되잖아요."
    action: "she answers confidently, leaning back a little"

  - id: s09
    char: detective
    line: "확인했습니다. 열 시 이십팔 분, 배달 완료. 기록은 정확하더군요."
    action: "he nods slightly while speaking"

  - id: s10
    char: suspect
    expr: smirk
    line: "그럼 됐네요. 이제 가 봐도 되죠?"
    action: "she speaks with relief and impatience"

  - id: s11
    char: detective
    line: "하나만 더요. 배달 기사가 한서진 씨 얼굴을 봤습니까?"
    action: "he leans forward slightly, voice low"

  - id: s12
    char: suspect
    expr: nervous
    line: "문 앞에 두고 가 달라고 했어요. 요즘 다들 그렇게 하잖아요."
    action: "she hesitates before answering, eyes darting"

  - id: s13
    char: rookie
    line: "선배님, 배달 앱 회사에서 자료 왔습니다. 이거 보셔야 합니다."
    action: "he speaks quickly, slightly out of breath"

  - id: s14
    char: detective
    line: "읽어 봐."
    action: "short command, without looking away"

  - id: s15
    char: rookie
    line: "해당 주문은 열 시에 들어온 게 아닙니다. 어제 오후 여섯 시에 예약 주문으로 접수됐습니다. 도착 시간 지정, 열 시 반."
    action: "he reads from the folder in a clear voice"

  - id: s16
    char: detective
    line: "배가 고파서 열 시쯤 시키셨다고 했죠. 네 시간 전부터 배가 고플 걸 아셨나 봅니다."
    action: "he speaks with quiet irony"

  - id: s17
    char: suspect
    expr: nervous
    line: "그, 그건 퇴근하면서 미리 시켜 둔 거예요. 제가 착각했어요. 그게 무슨 문제죠?"
    action: "she stammers, then tries to regain composure"

  - id: s18
    char: rookie
    line: "하나 더 있습니다. 그 음식, 오늘 아침까지 문 앞에 그대로 놓여 있었다고 옆집 주민이 진술했습니다."
    action: "he speaks firmly, glancing at the folder"

  - id: s19
    char: detective
    line: "집에 계셨다면서, 문 앞의 짬뽕은 밤새 식어 가고 있었네요."
    action: "he speaks slowly, letting the words sink in"

  - id: s20
    char: suspect
    expr: angry
    line: "잠들었을 수도 있잖아요! 고작 그걸로 제가 은우를 죽였다고요?"
    action: "she shouts angrily"

  - id: s21
    char: detective
    line: "아니요. 그것만으론 부족하죠. 그래서 마지막으로 하나만 묻겠습니다."
    action: "he answers in a calm, heavy voice"

  - id: s22
    char: suspect
    expr: nervous
    line: "뭔데요."
    action: "she whispers tensely"

  - id: s23
    char: detective
    line: "아까 처음에, 서은우 씨가 조각상에 맞아서 얼마나 아팠겠냐고 하셨죠. 그 얘기, 누구한테 들으셨습니까?"
    action: "he speaks deliberately, eyes locked on her"

  - id: s24
    char: suspect
    expr: shocked
    line: "그건, 뉴스에서 봤어요."
    action: "she freezes, then answers in a small voice"

  - id: s25
    char: rookie
    line: "선배님, 사인은 아직 언론에 공개된 적 없습니다. 흉기가 청동 조각상이라는 건 감식팀과 저희만 압니다."
    action: "he speaks clearly and seriously"

  - id: s26
    char: detective
    line: "현장에 없었던 사람은 절대 알 수 없는 사실이죠."
    action: "he speaks quietly and decisively"

  - id: s27
    char: suspect
    expr: defeated
    line: "그날 밤, 은우가 갤러리를 혼자 갖겠다고 했어요. 십 년이에요. 십 년을 같이 만든 건데."
    action: "she speaks slowly in a broken voice, gaze lowered"

  - id: s28
    char: detective
    line: "알리바이까지 예약해 두셨으면서, 말 한마디는 예약을 못 하셨군요."
    action: "he speaks with a tired sigh"

  - id: s29
    char: rookie
    line: "한서진 씨, 서은우 씨 살해 혐의로 긴급 체포합니다."
    action: "he speaks formally and firmly"

  - id: s30
    char: detective
    line: "완벽한 거짓말은 없다. 언제나, 한마디가 더 많을 뿐이다."
    action: "he looks straight into the camera and speaks in a low narrating voice"
