<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1035">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="단어공부">
<title>✦ WORD A DAY</title>
<link rel="manifest" id="manifest-placeholder">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap');
  :root {
    --bg1:#0f0c29;--bg2:#302b63;--bg3:#24243e;
    --accent:#a78bfa;--accent2:#60a5fa;
    --green:#4ade80;--red:#f87171;--yellow:#facc15;
    --text:#e2e0ff;--muted:#9ca3af;--faint:#6b7280;
    --card:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
    background-attachment:fixed;font-family:'Noto Sans KR',sans-serif;
    color:var(--text);min-height:100vh;
    display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;
  }
  .header{text-align:center;margin-bottom:20px;}
  .title{
    font-family:'Playfair Display',serif;font-size:26px;letter-spacing:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;
  }
  .subtitle{font-size:11px;color:var(--muted);letter-spacing:4px;text-transform:uppercase;}
  .tabs{
    display:flex;gap:6px;margin-bottom:20px;
    background:rgba(255,255,255,0.05);border-radius:12px;padding:4px;
    width:100%;max-width:400px;
  }
  .tab{
    flex:1;padding:9px 4px;border-radius:10px;border:none;
    cursor:pointer;font-size:13px;font-family:inherit;
    background:transparent;color:var(--muted);transition:all .2s;
  }
  .tab.active{background:rgba(167,139,250,0.25);color:var(--accent);}
  .view{display:none;flex-direction:column;align-items:center;width:100%;max-width:400px;}
  .view.active{display:flex;}
  .prog-wrap{width:100%;margin-bottom:16px;}
  .prog-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .prog-track{height:6px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s;}
  .dots{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;justify-content:center;}
  .dot{width:10px;height:10px;border-radius:50%;cursor:pointer;background:rgba(255,255,255,0.15);transition:background .2s;}
  .dot.active{background:var(--accent);}
  .dot.learned{background:var(--green);}
  .dot.correct{background:var(--green);}
  .dot.wrong{background:var(--red);}
  .card{
    width:100%;background:var(--card);backdrop-filter:blur(12px);
    border:1px solid var(--border);border-radius:20px;
    padding:32px 24px;text-align:center;cursor:pointer;
    transition:transform .15s,box-shadow .15s;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    margin-bottom:20px;min-height:200px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    user-select:none;
  }
  .card:active{transform:scale(0.98);}
  .badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:14px;}
  .badge.beginner{background:rgba(74,222,128,.15);color:var(--green);border:1px solid rgba(74,222,128,.3);}
  .badge.intermediate{background:rgba(250,204,21,.15);color:var(--yellow);border:1px solid rgba(250,204,21,.3);}
  .badge.advanced{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3);}
  .word{font-family:'Playfair Display',serif;font-size:34px;color:#fff;letter-spacing:1px;margin-bottom:8px;}
  .hint{font-size:13px;color:var(--faint);font-style:italic;}
  .meaning{font-size:19px;color:#c4b5fd;margin-bottom:8px;font-weight:700;}
  .example{font-size:13px;color:var(--muted);font-style:italic;margin-top:8px;line-height:1.5;}
  .btn-row{display:flex;gap:10px;width:100%;margin-bottom:12px;}
  .btn{
    flex:1;padding:14px;border-radius:12px;border:none;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:700;
    transition:opacity .15s,transform .1s;letter-spacing:.5px;
  }
  .btn:active{transform:scale(0.97);opacity:0.85;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
  .btn-success{background:linear-gradient(135deg,var(--green),#22d3ee);color:#fff;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:var(--muted);}
  .btn-danger{background:rgba(248,113,113,0.15);color:var(--red);border:1px solid rgba(248,113,113,0.3);}
  .quiz-opt{
    width:100%;padding:14px 18px;border-radius:12px;
    border:1.5px solid var(--border);background:rgba(255,255,255,0.04);
    color:var(--text);cursor:pointer;font-family:inherit;font-size:14px;
    text-align:left;margin-bottom:10px;transition:all .2s;line-height:1.4;
  }
  .quiz-opt:active{transform:scale(0.98);}
  .quiz-opt.correct{border-color:var(--green);background:rgba(74,222,128,.1);color:var(--green);}
  .quiz-opt.wrong{border-color:var(--red);background:rgba(248,113,113,.1);color:var(--red);}
  .quiz-opt.disabled{cursor:default;}
  .quiz-result{text-align:center;margin:4px 0 12px;font-size:15px;font-weight:700;}
  .quiz-result.ok{color:var(--green);}
  .quiz-result.ng{color:var(--red);}
  .banner{
    background:linear-gradient(135deg,rgba(74,222,128,.12),rgba(34,211,238,.12));
    border:1px solid rgba(74,222,128,.3);border-radius:16px;
    padding:18px;text-align:center;margin-bottom:16px;width:100%;
  }
  .banner-icon{font-size:28px;margin-bottom:6px;}
  .banner-title{font-weight:700;color:var(--green);font-size:16px;}
  .banner-sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .stat-grid{display:flex;gap:10px;width:100%;margin-bottom:12px;}
  .stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;}
  .stat-num{font-family:'Playfair Display',serif;font-size:28px;color:var(--accent);}
  .stat-label{font-size:11px;color:var(--muted);margin-top:3px;}
  .history-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;width:100%;margin-bottom:12px;}
  .history-title{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:12px;text-transform:uppercase;}
  .history-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px;}
  .history-row:last-child{border-bottom:none;}
  .history-date.today{color:var(--accent);}
  .history-date{color:var(--muted);}
  .history-info{color:var(--faint);font-size:12px;}
  .empty{color:var(--faint);font-size:13px;text-align:center;padding:12px 0;}
  .date-label{font-size:11px;color:var(--faint);margin-top:4px;}
  .word-counter{font-size:12px;color:var(--faint);margin-bottom:8px;}
  .speak-row{display:flex;gap:8px;margin-top:12px;justify-content:center;}
  .speak-btn{
    display:flex;align-items:center;gap:5px;
    padding:7px 14px;border-radius:99px;border:1.5px solid rgba(167,139,250,0.35);
    background:rgba(167,139,250,0.1);color:var(--accent);
    cursor:pointer;font-size:12px;font-family:inherit;font-weight:700;
    transition:all .2s;letter-spacing:.3px;
  }
  .speak-btn:active{transform:scale(0.95);background:rgba(167,139,250,0.25);}
  .speak-btn.speaking{background:rgba(167,139,250,0.3);border-color:var(--accent);animation:pulse 0.8s infinite;}
  .speak-btn.ex{border-color:rgba(96,165,250,0.35);background:rgba(96,165,250,0.1);color:var(--accent2);}
  .speak-btn.ex.speaking{background:rgba(96,165,250,0.3);border-color:var(--accent2);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
  .tts-hint{font-size:11px;color:var(--faint);margin-top:6px;text-align:center;}
  /* quiz speak btn */
  .q-speak{
    display:inline-flex;align-items:center;gap:4px;
    padding:5px 12px;border-radius:99px;
    border:1.5px solid rgba(167,139,250,0.35);
    background:rgba(167,139,250,0.1);color:var(--accent);
    cursor:pointer;font-size:12px;font-family:inherit;
    transition:all .2s;margin-top:8px;
  }
  .q-speak:active{transform:scale(0.95);}
  .install-banner{
    position:fixed;bottom:0;left:0;right:0;
    background:rgba(30,27,60,0.97);border-top:1px solid var(--border);
    padding:16px 20px;display:flex;align-items:center;gap:12px;
    z-index:100;backdrop-filter:blur(12px);
  }
  .install-text{flex:1;font-size:13px;line-height:1.5;}
  .install-text strong{color:var(--accent);}
  .install-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px;}
</style>
</head>
<body>
<div class="header">
  <div class="title">✦ WORD A DAY ✦</div>
  <div class="subtitle">매일 영단어 학습</div>
</div>
<div class="tabs">
  <button class="tab active" onclick="switchView('study')">📖 학습</button>
  <button class="tab" onclick="switchView('quiz')">📝 퀴즈</button>
  <button class="tab" onclick="switchView('stats')">📊 통계</button>
</div>

<!-- STUDY -->
<div class="view active" id="view-study">
  <div class="prog-wrap">
    <div class="prog-labels"><span>오늘의 학습</span><span id="prog-text">0/10 완료</span></div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="dots" id="study-dots"></div>
  <div class="banner" id="done-banner" style="display:none">
    <div class="banner-icon">🎉</div>
    <div class="banner-title">오늘 학습 완료!</div>
    <div class="banner-sub">퀴즈로 복습해보세요</div>
  </div>
  <div class="card" id="study-card" onclick="flipCard()">
    <div class="badge" id="s-badge"></div>
    <div class="word" id="s-word"></div>
    <div id="s-back">
      <div class="meaning" id="s-meaning"></div>
      <div class="example" id="s-example"></div>
    </div>
    <div class="hint" id="s-hint">탭하여 뜻 보기 👆</div>
    <div class="speak-row" onclick="event.stopPropagation()">
      <button class="speak-btn" id="btn-speak-word" onclick="speakWord()">🔊 단어</button>
      <button class="speak-btn ex" id="btn-speak-ex" onclick="speakExample()">🔊 예문</button>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-ghost" onclick="prevCard('study')">← 이전</button>
    <button class="btn btn-success" id="btn-learned" onclick="markLearned()">✓ 외웠어요!</button>
  </div>
  <div class="date-label" id="today-label"></div>
</div>

<!-- QUIZ -->
<div class="view" id="view-quiz">
  <div class="dots" id="quiz-dots"></div>
  <div class="card" style="cursor:default;margin-bottom:16px;">
    <div class="badge" id="q-badge"></div>
    <div class="word" id="q-word"></div>
    <div class="hint">이 단어의 뜻은?</div>
    <button class="q-speak" onclick="speakQuizWord()">🔊 발음 듣기</button>
  </div>
  <div id="quiz-options"></div>
  <div class="quiz-result" id="quiz-result"></div>
  <div class="btn-row">
    <button class="btn btn-ghost" onclick="prevCard('quiz')">← 이전</button>
    <button class="btn btn-primary" onclick="nextCard('quiz')">다음 →</button>
  </div>
</div>

<!-- STATS -->
<div class="view" id="view-stats">
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-num" id="st-total">0</div><div class="stat-label">총 학습 단어</div></div>
    <div class="stat-box"><div class="stat-num" id="st-acc">—</div><div class="stat-label">퀴즈 정답률</div></div>
    <div class="stat-box"><div class="stat-num" id="st-days">0</div><div class="stat-label">학습 일수</div></div>
  </div>
  <div class="history-card">
    <div class="history-title">최근 학습 기록</div>
    <div id="history-list"></div>
  </div>
  <button class="btn btn-danger" style="width:100%;margin-top:4px;" onclick="resetData()">🗑 기록 초기화</button>
</div>

<div class="install-banner" id="install-banner" style="display:none">
  <div>📲</div>
  <div class="install-text"><strong>홈화면에 추가</strong>하면 앱처럼 사용 가능!<br>크롬 메뉴 → "홈 화면에 추가"</div>
  <button class="install-close" onclick="document.getElementById('install-banner').style.display='none'">✕</button>
</div>

const LEVEL_KR={beginner:"초급",intermediate:"중급",advanced:"고급"};
const DAILY=10;

function getTodayKey(){return new Date().toISOString().split('T')[0];}
function getDailyWords(date){
  let h=0;
  for(let i=0;i<date.length;i++) h=(h*31+date.charCodeAt(i))&0xffffffff;
  const s=Math.abs(h)%WORDS.length;
  return Array.from({length:DAILY},(_,i)=>WORDS[(s+i)%WORDS.length]);
}

let storage={};
try{storage=JSON.parse(localStorage.getItem('vocabApp500')||'{}');}catch{}
function save(){try{localStorage.setItem('vocabApp500',JSON.stringify(storage));}catch{}}

const todayKey=getTodayKey();
if(!storage[todayKey]) storage[todayKey]={learned:[],quiz:{}};
const daily=getDailyWords(todayKey);

let studyIdx=0,quizIdx=0,flipped=false,quizAnswered=false;

// ── TTS ──
let ttsSupported = 'speechSynthesis' in window;
let currentUtterance = null;

function speak(text, btnId, rate=0.85) {
  if (!ttsSupported) { alert('이 브라우저는 음성 재생을 지원하지 않습니다.'); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US'; utter.rate = rate; utter.pitch = 1;
  // prefer a natural English voice
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.lang.startsWith('en') && v.localService) ||
                    voices.find(v => v.lang.startsWith('en')) || null;
  if (preferred) utter.voice = preferred;
  if (btnId) {
    const btn = document.getElementById(btnId);
    if (btn) btn.classList.add('speaking');
    utter.onend = () => { if (btn) btn.classList.remove('speaking'); };
    utter.onerror = () => { if (btn) btn.classList.remove('speaking'); };
  }
  currentUtterance = utter;
  window.speechSynthesis.speak(utter);
}

function speakWord() { speak(daily[studyIdx].word, 'btn-speak-word', 0.8); }
function speakExample() { speak(daily[studyIdx].example, 'btn-speak-ex', 0.85); }
function speakQuizWord() { speak(daily[quizIdx].word, null, 0.8); }

// voices load async on some browsers
if (ttsSupported) window.speechSynthesis.onvoiceschanged = () => {};

function renderStudy(){
  const w=daily[studyIdx];
  const learnedSet=new Set(storage[todayKey].learned||[]);
  const pct=Math.round(learnedSet.size/DAILY*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-text').textContent=learnedSet.size+'/'+DAILY+' 완료';
  document.getElementById('today-label').textContent=todayKey+' 오늘의 단어 '+DAILY+'개 (총 '+WORDS.length+'개)';
  const allDone=daily.every(ww=>learnedSet.has(ww.word));
  document.getElementById('done-banner').style.display=allDone?'block':'none';
  const dotsEl=document.getElementById('study-dots');
  dotsEl.innerHTML=daily.map((ww,i)=>
    `<div class="dot ${learnedSet.has(ww.word)?'learned':''} ${i===studyIdx&&!learnedSet.has(ww.word)?'active':''}" onclick="jumpStudy(${i})"></div>`
  ).join('');
  const badge=document.getElementById('s-badge');
  badge.textContent=LEVEL_KR[w.level];badge.className='badge '+w.level;
  document.getElementById('s-word').textContent=w.word;
  document.getElementById('s-meaning').textContent=w.meaning;
  document.getElementById('s-example').textContent='"'+w.example+'"';
  const back=document.getElementById('s-back'),hint=document.getElementById('s-hint');
  if(flipped){back.style.display='block';hint.style.display='none';}
  else{back.style.display='none';hint.style.display='block';}
  const btn=document.getElementById('btn-learned');
  if(learnedSet.has(w.word)){
    btn.textContent='다음 →';btn.className='btn btn-primary';
    btn.onclick=()=>{if(studyIdx<DAILY-1){studyIdx++;flipped=false;renderStudy();}};
  }else{
    btn.textContent='✓ 외웠어요!';btn.className='btn btn-success';btn.onclick=markLearned;
  }
}

function renderQuiz(){
  const w=daily[quizIdx];
  const qData=storage[todayKey].quiz||{};
  const dotsEl=document.getElementById('quiz-dots');
  dotsEl.innerHTML=daily.map((ww,i)=>{
    const r=qData[ww.word];let cls=i===quizIdx?'active':'';
    if(r===true)cls='correct';if(r===false)cls='wrong';
    return `<div class="dot ${cls}" onclick="jumpQuiz(${i})"></div>`;
  }).join('');
  const badge=document.getElementById('q-badge');
  badge.textContent=LEVEL_KR[w.level];badge.className='badge '+w.level;
  document.getElementById('q-word').textContent=w.word;
  const wrong=WORDS.filter(x=>x.word!==w.word).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.meaning);
  const opts=[...wrong,w.meaning].sort(()=>Math.random()-.5);
  quizAnswered=false;
  document.getElementById('quiz-result').textContent='';
  document.getElementById('quiz-options').innerHTML=opts.map((o,i)=>
    `<button class="quiz-opt" onclick="answerQuiz(this,'${o.replace(/'/g,"\\'")}','${w.meaning.replace(/'/g,"\\'")}')">${String.fromCharCode(65+i)}. ${o}</button>`
  ).join('');
}

function renderStats(){
  const allDays=Object.keys(storage).sort().reverse().slice(0,7);
  let totL=0,totC=0,totQ=0;
  Object.values(storage).forEach(d=>{
    totL+=(d.learned||[]).length;
    const qs=Object.values(d.quiz||{});
    totC+=qs.filter(Boolean).length;totQ+=qs.length;
  });
  document.getElementById('st-total').textContent=totL;
  document.getElementById('st-acc').textContent=totQ>0?Math.round(totC/totQ*100)+'%':'—';
  document.getElementById('st-days').textContent=Object.keys(storage).length;
  const list=document.getElementById('history-list');
  if(!allDays.length){list.innerHTML='<div class="empty">아직 학습 기록이 없어요</div>';return;}
  list.innerHTML=allDays.map(day=>{
    const d=storage[day];
    const qc=Object.values(d.quiz||{}).length;
    const cc=Object.values(d.quiz||{}).filter(Boolean).length;
    const isToday=day===todayKey;
    return `<div class="history-row">
      <span class="history-date ${isToday?'today':''}">${day}${isToday?' (오늘)':''}</span>
      <span class="history-info">단어 ${(d.learned||[]).length}개 · 퀴즈 ${qc>0?cc+'/'+qc:'—'}</span>
    </div>`;
  }).join('');
}

function flipCard(){flipped=!flipped;renderStudy();}
function markLearned(){
  const w=daily[studyIdx];
  const learned=storage[todayKey].learned||[];
  if(!learned.includes(w.word)){storage[todayKey].learned=[...learned,w.word];save();}
  flipped=false;if(studyIdx<DAILY-1)studyIdx++;renderStudy();
}
function jumpStudy(i){studyIdx=i;flipped=false;renderStudy();}
function jumpQuiz(i){quizIdx=i;renderQuiz();}
function prevCard(v){
  if(v==='study'){if(studyIdx>0){studyIdx--;flipped=false;renderStudy();}}
  else{if(quizIdx>0){quizIdx--;renderQuiz();}}
}
function nextCard(v){if(v==='quiz'){if(quizIdx<DAILY-1){quizIdx++;renderQuiz();}}}
function answerQuiz(el,opt,correct){
  if(quizAnswered)return;quizAnswered=true;
  const w=daily[quizIdx];
  const isCorrect=opt===correct;
  storage[todayKey].quiz={...(storage[todayKey].quiz||{}),[w.word]:isCorrect};save();
  document.querySelectorAll('.quiz-opt').forEach(b=>{
    b.classList.add('disabled');
    const txt=b.textContent.slice(3);
    if(txt===correct)b.classList.add('correct');
    else if(txt===opt&&!isCorrect)b.classList.add('wrong');
  });
  const res=document.getElementById('quiz-result');
  res.textContent=isCorrect?'✓ 정답!':'✗ 오답 — 정답: '+correct;
  res.className='quiz-result '+(isCorrect?'ok':'ng');
  const qData=storage[todayKey].quiz||{};
  document.getElementById('quiz-dots').innerHTML=daily.map((ww,i)=>{
    const r=qData[ww.word];let cls=i===quizIdx?'active':'';
    if(r===true)cls='correct';if(r===false)cls='wrong';
    return `<div class="dot ${cls}" onclick="jumpQuiz(${i})"></div>`;
  }).join('');
}
function resetData(){
  if(confirm('모든 학습 기록을 삭제할까요?')){
    storage={};save();storage[todayKey]={learned:[],quiz:{}};renderStats();
  }
}
function switchView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab')[['study','quiz','stats'].indexOf(v)].classList.add('active');
  if(v==='study')renderStudy();
  else if(v==='quiz')renderQuiz();
  else renderStats();
}
