<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect x="0" y="0" width="1080" height="1920" fill="#000000" fill-opacity="0"/><g id="ai"></g><g id="bg"><rect x="22" y="22" width="1036" height="1876" rx="10" fill="none" stroke="#111111" stroke-width="16"/><rect x="334.0" y="89.4" width="412.1" height="61.2" rx="10" fill="#111111"/><text x="540" y="132.96" font-family="Do Hyeon" font-size="36" fill="#ffffff" text-anchor="middle" >지식 쇼츠 · 돈과 생활</text></g><g id="title"><text x="540" y="300" font-family="Black Han Sans" font-size="100" fill="#ffffff" text-anchor="middle" stroke="#2b1055" stroke-width="14" paint-order="stroke" stroke-linejoin="round">① 연말정산 미리보기</text></g><g id="how"><rect x="102" y="434" width="900" height="250" rx="18" fill="#111111"/><rect x="90" y="420" width="900" height="250" rx="18" fill="#fffdf5" stroke="#111111" stroke-width="8"/><rect x="392.6" y="457.7" width="294.8" height="64.6" rx="10" fill="#111111"/><text x="540" y="503.68" font-family="Do Hyeon" font-size="38" fill="#ffffff" text-anchor="middle" >홈택스 · 무료</text><text x="540" y="580" font-family="Black Han Sans" font-size="52" fill="#111111" text-anchor="middle" >1~9월 카드 사용액으로</text><text x="540" y="645" font-family="Black Han Sans" font-size="52" fill="#e63946" text-anchor="middle" >예상 환급액 미리 계산</text></g><g id="tip"><rect x="196.2" y="726.8" width="703.6" height="86.4" rx="43.2" fill="#111111"/><rect x="188.2" y="716.8" width="703.6" height="86.4" rx="43.2" fill="#ffb703" stroke="#111111" stroke-width="7"/><text x="540" y="777.28" font-family="Jua" font-size="48" fill="#111111" text-anchor="middle" >토해낼 것 같으면 지금 손쓰기</text></g></svg>