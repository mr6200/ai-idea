<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect x="0" y="0" width="1080" height="1920" fill="#000000" fill-opacity="0"/><defs><linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.62"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient><linearGradient id="bot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.78"/></linearGradient></defs><rect width="1080" height="720" fill="url(#top)"/><rect y="1180" width="1080" height="740" fill="url(#bot)"/><text x="540" y="200" font-family="Do Hyeon" font-size="36" fill="#f2c14e" text-anchor="middle" letter-spacing="6">세계의 미스터리</text><rect y="980" width="1080" height="940" fill="#000" fill-opacity="0.35"/><text x="540" y="1150" font-family="Black Han Sans" font-size="136" fill="#ffffff" text-anchor="middle" stroke="#000" stroke-opacity="0.55" stroke-width="7" paint-order="stroke" stroke-linejoin="round">로스웰 사건의</text><text x="540" y="1330" font-family="Black Han Sans" font-size="170" fill="#f2c14e" text-anchor="middle" stroke="#000" stroke-opacity="0.55" stroke-width="7" paint-order="stroke" stroke-linejoin="round">진짜 정체</text><rect x="105" y="1443" width="871" height="94" rx="47" fill="#e4572e"/><text x="540" y="1508.2" font-family="Do Hyeon" font-size="52" fill="#ffffff" text-anchor="middle" >1947년 미군 발표 「비행접시 회수」</text><text x="540" y="1640" font-family="Do Hyeon" font-size="52" fill="#ffffff" text-anchor="middle" stroke="#000" stroke-opacity="0.7" stroke-width="7" paint-order="stroke">외계인일까, 비밀 풍선일까</text></svg>