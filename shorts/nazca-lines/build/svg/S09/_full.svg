<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect x="0" y="0" width="1080" height="1920" fill="#000000" fill-opacity="0"/><defs><linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.62"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient><linearGradient id="bot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.78"/></linearGradient></defs><rect width="1080" height="720" fill="url(#top)"/><rect y="1180" width="1080" height="740" fill="url(#bot)"/><text x="540" y="200" font-family="Do Hyeon" font-size="36" fill="#f2c14e" text-anchor="middle" letter-spacing="6">세계의 미스터리</text><text x="540" y="340" font-family="Black Han Sans" font-size="110" fill="#f2c14e" text-anchor="middle" stroke="#000" stroke-opacity="0.55" stroke-width="7" paint-order="stroke" stroke-linejoin="round">왜 그렸을까?</text><rect x="70" y="440" width="590" height="150" rx="12" fill="#000" fill-opacity="0.5"/><rect x="82" y="454" width="9" height="122" fill="#f2c14e"/><text x="114" y="494" font-family="Do Hyeon" font-size="34" fill="#d9d9d9" text-anchor="start" >별자리 달력설 (1940년대~)</text><text x="114" y="562" font-family="Do Hyeon" font-size="54" fill="#ffffff" text-anchor="start" >지금은 의심받는 설명</text><rect x="70" y="610" width="883" height="150" rx="12" fill="#000" fill-opacity="0.5"/><rect x="82" y="624" width="9" height="122" fill="#f2c14e"/><text x="114" y="664" font-family="Do Hyeon" font-size="34" fill="#d9d9d9" text-anchor="start" >물 · 풍요를 비는 의식의 길</text><text x="114" y="732" font-family="Do Hyeon" font-size="54" fill="#ffffff" text-anchor="start" >많은 학자의 설명 · 아직 확정 아님</text></svg>